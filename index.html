<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qual AI | Automated Booking Systems for HVAC</title>
  <meta property="og:title" content="Your Evaluation is Confirmed | Qual AI" />
  <meta property="og:description"
    content="Watch this 5-minute briefing before our call. It explains exactly how we deliver qualified HVAC appointments that convert to profitable jobs." />
  <meta property="og:image" content="https://qual-ai-demo.vercel.app/video-thumbnail.jpg" />
  <meta property="og:url" content="https://qual-ai-demo.vercel.app/" />
  <meta property="og:type" content="website" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lexend:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              800: '#1e293b',
              900: '#0f172a',
              950: '#020617',
            },
            accent: '#2563eb', // Sharper Blue for better accessibility
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            heading: ['Lexend', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: 'Lexend', sans-serif;
    }

    .vsl-pulse {
      animation: pulse-ring 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    @keyframes pulse-ring {
      0% {
        transform: scale(0.95);
        opacity: 0.5;
      }

      50% {
        transform: scale(1.05);
        opacity: 0.3;
      }

      100% {
        transform: scale(0.95);
        opacity: 0.5;
      }
    }

    @keyframes marquee {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(-100%);
      }
    }

    .animate-marquee {
      animation: marquee 30s linear infinite;
    }

    /* Animation classes */
    .animate-fade-in {
      animation: fadeIn 0.6s ease-out forwards;
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.6s ease-out forwards;
    }

    .animate-fade-in-delayed {
      animation: fadeIn 0.6s ease-out 0.2s forwards;
      opacity: 0;
    }

    .animate-stagger-1 { animation-delay: 0.1s; }
    .animate-stagger-2 { animation-delay: 0.2s; }
    .animate-stagger-3 { animation-delay: 0.3s; }
    .animate-stagger-4 { animation-delay: 0.4s; }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-slide-up {
      animation: slideUp 0.5s ease-out forwards;
    }

    /* Subtle glow pulse for CTA buttons */
    .cta-glow {
      box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4);
      animation: ctaGlow 2s ease-in-out infinite;
    }

    @keyframes ctaGlow {
      0%, 100% {
        box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.4);
      }
      50% {
        box-shadow: 0 0 20px 4px rgba(37, 99, 235, 0.2);
      }
    }

    /* Hover lift effect */
    .hover-lift {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .hover-lift:hover {
      transform: translateY(-4px);
      box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.15);
    }

    /* Glassmorphism card effect */
    .glass-card {
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
  </style>

</head>

<body class="selection:bg-accent selection:text-white">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
